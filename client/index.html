<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Story Weaver - Collaborative Farcaster Stories</title>
    
    <!-- Farcaster Mini App Meta Tags -->
    <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://worthifyme.in/story-weaver-promo.jpg","button":{"title":"🧙‍♂️ Start Weaving","action":{"type":"launch_frame","name":"Story Weaver","url":"https://worthifyme.in","splashImageUrl":"https://worthifyme.in/story-weaver-promo.jpg","splashBackgroundColor":"#8a63d2"}}}' />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Collaborative storytelling on Farcaster. Like posts to unlock writing privileges and contribute to evolving shared narratives with the community." />
    <meta name="keywords" content="Farcaster, collaborative writing, storytelling, social media, blockchain, mini app" />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Story Weaver - Collaborative Farcaster Stories" />
    <meta property="og:description" content="Transform any Farcaster cast into collaborative storytelling. Like to unlock commenting and weave magical narratives together." />
    <meta property="og:image" content="https://worthifyme.in/story-weaver-promo.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://worthifyme.in" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Story Weaver - Collaborative Farcaster Stories" />
    <meta name="twitter:description" content="Transform any Farcaster cast into collaborative storytelling. Use the 'Weave My Part' action to start magical narratives." />
    <meta name="twitter:image" content="https://worthifyme.in/story-weaver-promo.jpg" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Farcaster Mini App SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@farcaster/miniapp-sdk/dist/index.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
    
    <!-- Farcaster Mini App ready call -->
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        if (window.frame && window.frame.sdk) {
          try {
            await window.frame.sdk.actions.ready();
            console.log("Farcaster Mini App SDK initialized");
          } catch (error) {
            console.warn("Failed to initialize Farcaster SDK:", error);
          }
        }
      });
    </script>
  </body>
</html>
